# Release: on a tag v<version> (the version of mygo.json), builds
# AudioSmith for macOS on Apple silicon — the Swift engine, then
# `go tool mygo build` signed with the Developer ID, notarized, in a disk
# image, with the signed update files — checks it, then publishes it
# (scripts/release-publish.sh, threads #69 and #71): to actnow.dev through
# the site's own script, scripts/actnow-publish.sh (vendored), which sends
# every file to the site's release API with the one secret
# ACTNOW_INGEST_TOKEN; the site checks them, stores them, lists the version
# on its download and changelog pages and publishes it (copies that read
# the website see the update at once). Then a draft GitHub release with the
# notes, which you review and publish. docs/release.md (English) and
# docs/release.zh-CN.md (中文) list the secrets and walk through a release.
#
# A tag with a prerelease part, such as v0.4.0-beta.5, makes a beta: on the
# website the beta channel, /updates/audiosmith/beta/ (copies with
# Settings → Receive beta updates on read it), on GitHub a prerelease.
# Other tags (v0.4.0) are releases.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: it
# builds and uploads the disk image as an artifact of the run, signed ad
# hoc, or with "sign" signed and notarized with the secrets, checks the
# build with actnow-publish.sh --dry-run, and never touches the website or
# a release; it needs no website token.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and notarize with the secrets (else ad hoc, without secrets)"
        type: boolean
        default: false

permissions:
  contents: write # the draft release, and the uploads to it

env:
  # The move to actnow.dev (thread #69). Copies of 0.4.0-beta.1 … beta.4
  # read their updates from GitHub releases. While this is "true", a
  # release also puts its update archive on its GitHub release with a
  # manifest pointing at it there, so that those copies update to it;
  # the app itself reads actnow.dev. Set it to "false" once 0.4.0-beta.5
  # is published: later GitHub releases then carry the notes and the
  # website's manifest only (scripts/release-publish.sh).
  GITHUB_FEED: "true"
  # "false" stops a release at "verified" on actnow.dev (actnow-publish.sh
  # --no-publish): publish it by hand in https://actnow.dev/panel/releases.
  WEBSITE_PUBLISH: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (Apple silicon)
    # The engine needs Xcode 26 (swift-tools-version 6.2) and MLX needs
    # Apple silicon; macos-26 runners are arm64.
    runs-on: macos-26
    timeout-minutes: 240 # a team's first notarizations can take an hour or more
    env:
      RELEASE: ${{ github.event_name == 'push' }}
      SIGN: ${{ github.event_name == 'push' || inputs.sign }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the version and the changelog
        run: |
          # The tag is v<version of mygo.json>, CHANGELOG.md and
          # CHANGELOG.zh-Hans.md have the same versions, and CHANGELOG.md has the
          # version's own section; VERSION and PRERELEASE (a beta) for the
          # steps below.
          if [ "$RELEASE" = true ]; then
            out="$(scripts/release-check.sh "$GITHUB_REF_NAME" 2>&1)" || { echo "::error::$out"; exit 1; }
          else
            out="$(scripts/release-check.sh 2>&1)" || { echo "::error::$out"; exit 1; }
          fi
          echo "$out"
          echo "$out" >> "$GITHUB_ENV"

      - name: Check the secrets
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$APPLE_API_KEY" ]; then
            for name in APPLE_ID APPLE_APP_PASSWORD; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
          else
            for name in APPLE_API_KEY_ID APPLE_API_ISSUER; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing (docs/release.md)"
            exit 1
          fi
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ] || [ -z "$MYGO_UPDATER_PUBLIC_KEY" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::a release needs the secret MYGO_UPDATER_PRIVATE_KEY and the variable MYGO_UPDATER_PUBLIC_KEY (docs/release.md, step 4)"
              exit 1
            fi
            echo "::warning::no update keys: this build will not update itself"
          fi

      - name: Check the website's token
        # Before the long build and notarization: a release publishes to
        # actnow.dev. Dry runs need no token.
        if: env.RELEASE == 'true'
        env:
          ACTNOW_INGEST_TOKEN: ${{ secrets.ACTNOW_INGEST_TOKEN }}
        run: |
          if [ -z "$ACTNOW_INGEST_TOKEN" ]; then
            echo "::error::a release publishes to actnow.dev and needs the secret ACTNOW_INGEST_TOKEN (the site's release-ingest token for audiosmith; docs/release.md, step 5)"
            exit 1
          fi

      - name: Compare the website's publish script
        # scripts/actnow-publish.sh is a reviewed copy of the site's; a newer
        # one on the site is worth a look, not a reason to stop.
        run: |
          if ! out="$(scripts/vendor-actnow-publish.sh --check 2>&1)"; then
            echo "$out"
            echo "::warning::scripts/actnow-publish.sh differs from https://actnow.dev/actnow-publish.sh (or the site was unreachable): this run uses the committed copy; refresh it with scripts/vendor-actnow-publish.sh"
          else
            echo "$out"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2> /dev/null | sort -V | tail -1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          # Xcode 26 installs the Metal toolchain, which builds MLX's
          # kernels, as a component of its own.
          xcrun metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Cache the engine's build
        uses: actions/cache@v4
        with:
          path: engine/.build
          key: engine-${{ runner.os }}-${{ hashFiles('engine/Package.swift', 'engine/Package.resolved', 'engine/patches/**', 'scripts/fetch-engine-deps.sh') }}-${{ hashFiles('engine/Sources/**', 'engine/Support/**') }}
          restore-keys: |
            engine-${{ runner.os }}-${{ hashFiles('engine/Package.swift', 'engine/Package.resolved', 'engine/patches/**', 'scripts/fetch-engine-deps.sh') }}-

      - name: Build the engine
        run: |
          if ! scripts/build-engine.sh Release; then
            tail -80 engine/.build/xcode/build-Release.log
            exit 1
          fi

      - name: Fetch the family's cue sounds
        # React Bits Sound Lab's audio, from the ActNow family's private
        # library (never in this repository): with ACTNOW_SOUNDS_TOKEN (a
        # read-only token of hehehai/actnow-sounds) the build carries them,
        # without it the app plays system sounds.
        env:
          ACTNOW_SOUNDS_TOKEN: ${{ secrets.ACTNOW_SOUNDS_TOKEN }}
        run: |
          if [ -z "$ACTNOW_SOUNDS_TOKEN" ]; then
            echo "::warning::no ACTNOW_SOUNDS_TOKEN: this build plays system sounds"
            exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${ACTNOW_SOUNDS_TOKEN}@github.com/hehehai/actnow-sounds" "$RUNNER_TEMP/actnow-sounds"
          ACTNOW_SOUNDS="$RUNNER_TEMP/actnow-sounds" scripts/sync-sounds.sh

      - name: Import the certificate and the notary credentials
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          if [ -n "$APPLE_API_KEY" ]; then
            # An App Store Connect API key: the .p8 file's contents.
            printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            rm "$RUNNER_TEMP/notary-key.p8"
          else
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          fi
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | grep "($APPLE_TEAM_ID)" | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity of team $APPLE_TEAM_ID"
            exit 1
          fi
          {
            echo "NOTARY_KEYCHAIN=$keychain"
            echo "NOTARY_PROFILE=notary"
            echo "MACOS_SIGNING_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Configure the release build
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ env.SIGN == 'true' && vars.MYGO_UPDATER_PUBLIC_KEY || '' }}
        run: |
          scripts/release-config.sh
          jq '{version, updates: (.updates | if . then {url, s3, github, publicKey: "set"} else null end), macos: {signingIdentity: (.macos.signingIdentity // "-" | if . == "-" then "ad hoc" else "Developer ID" end), notarize: (.macos.notarize != null)}}' mygo.json

      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ env.SIGN == 'true' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          # No -upload: actnow-publish.sh sends the files below. Delta
          # updates are made from the versions the website's manifests
          # (releases and beta/) name; the first version there has none.
          go tool mygo build -platform darwin/arm64

      - name: Verify
        run: |
          if [ "$SIGN" = true ] && [ -f build/darwin-arm64/update-darwin-arm64.json ]; then
            scripts/verify-release.sh --release
          else
            scripts/verify-release.sh
          fi

      - name: Publish to actnow.dev
        if: env.RELEASE == 'true'
        env:
          ACTNOW_INGEST_TOKEN: ${{ secrets.ACTNOW_INGEST_TOKEN }}
        run: |
          if [ "$WEBSITE_PUBLISH" = true ]; then
            scripts/release-publish.sh --skip-github
          else
            scripts/release-publish.sh --skip-github --no-publish
          fi

      - name: Draft the GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-publish.sh --skip-website

      - name: Keep the update files (release)
        # For finishing the GitHub release by hand when its step failed
        # after the website took the version (which refuses it again):
        # unpack into build/darwin-arm64, then
        # scripts/release-publish.sh --skip-website. No disk image: the
        # website's download page is its only place.
        if: env.RELEASE == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: AudioSmith-${{ env.VERSION }}-update
          path: |
            build/darwin-arm64/*.tar.gz
            build/darwin-arm64/*.delta
            build/darwin-arm64/update-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: What a release would publish (dry run)
        if: env.RELEASE != 'true'
        run: scripts/release-publish.sh --dry-run

      - name: Upload the disk image (dry run)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AudioSmith-${{ env.VERSION }}-${{ env.SIGN == 'true' && 'signed' || 'adhoc' }}
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.tar.gz
            build/darwin-arm64/*.delta
            build/darwin-arm64/update-*.json
            build/github
            build/github-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keychain
        if: always() && env.NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$NOTARY_KEYCHAIN" || true

      - name: Summary
        if: env.RELEASE == 'true'
        run: |
          {
            echo "### AudioSmith $VERSION"
            if [ "$PRERELEASE" = true ]; then
              channel="the beta channel: copies that receive beta updates see it"
              kind="draft prerelease"
            else
              channel="the stable channel: installed copies see it"
              kind="draft release"
            fi
            if [ "$WEBSITE_PUBLISH" = true ]; then
              echo "Sent to actnow.dev on $channel once published (the site's status is above); download at https://actnow.dev/download/audiosmith. Yank or roll back in https://actnow.dev/panel/releases."
            else
              echo "Verified on actnow.dev, not published (WEBSITE_PUBLISH=false): publish it in https://actnow.dev/panel/releases; then it is on $channel."
            fi
            echo "GitHub: the $kind [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME) has the notes$([ "$GITHUB_FEED" = true ] && echo ", the update archive and a manifest for copies that still read GitHub (GITHUB_FEED=true: set it to false after this transition release)" || echo " and the website's manifest")."
            echo "Review it, then publish it$([ "$PRERELEASE" = true ] && echo ', leaving "Set as a pre-release" ticked')."
          } >> "$GITHUB_STEP_SUMMARY"
