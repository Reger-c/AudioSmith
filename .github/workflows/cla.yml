# The Contributor License Agreement (CLA.md). On a pull request, CLA
# Assistant Lite (contributor-assistant/github-action) checks that every
# author of its commits has signed; a contributor signs by commenting the
# sentence it asks for. Signatures are a JSON file on the cla-signatures
# branch of this repository, which must exist before the first pull
# request (CONTRIBUTING.md, "For maintainers").
#
# Security: pull_request_target runs with a token that can write to this
# repository, so this workflow never checks out or runs the pull request's
# code. It has no checkout step; the action only reads the pull request's
# commits and comments through the API.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

# One run at a time per pull request. Each run reads all the pull
# request's comments, so a later run still records a signature whose own
# run was superseded; if two pull requests write the file at once, one
# fails, and commenting "recheck" runs it again.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    # Pull requests, and comments on pull requests that sign or recheck.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-runs the failed check after a signature
      contents: write # commits signatures to the cla-signatures branch
      pull-requests: write # comments, and locks merged pull requests
      statuses: write
    steps:
      - name: CLA Assistant Lite
        # v2.6.1, pinned by commit (the repository is archived: read-only).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/hehehai/AudioSmith/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: hehehai,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before we can merge it, we ask that $you
            sign the [AudioSmith Contributor License Agreement](https://github.com/hehehai/AudioSmith/blob/main/CLA.md):
            you keep the copyright in your work and license it to the project, which is
            released under the GNU AGPL-3.0 and may also be offered under other terms.
            To sign, post a comment with exactly the sentence below.
            感谢你的贡献！合并之前，请阅读并签署贡献者许可协议（CLA）：在本 PR 中留言，内容与下面这句完全一致。
          custom-allsigned-prcomment: All contributors have signed the CLA. 所有贡献者都已签署 CLA。
          signed-commit-message: "$contributorName has signed the CLA in $owner/$repo"
          create-file-commit-message: "CLA: the file of signatures"
          lock-pullrequest-aftermerge: true
